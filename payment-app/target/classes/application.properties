# Server Configuration
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:paymentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console - SECURITY FIX: Disabled by default, enable only in dev
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# CORS Configuration - SECURITY FIX: Restrict to specific origins
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.web.cors.allowed-origins=${cors.allowed.origins}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false

# Application Name
spring.application.name=payment-app

# Security - API Keys (loaded from environment variables)
payment.gateway.api.key=${PAYMENT_GATEWAY_API_KEY:}
payment.gateway.secret=${PAYMENT_GATEWAY_SECRET:}
admin.api.key=${ADMIN_API_KEY:}

# Logging
logging.level.com.demo.payment=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG:INFO}

