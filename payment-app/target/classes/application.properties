# Server Configuration
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:paymentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (SECURITY: Disable in production)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false

# Application Name
spring.application.name=payment-app

# Logging
logging.level.com.demo.payment=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Payment Gateway Configuration
# SECURITY: Set these via environment variables in production
# Example: export PAYMENT_GATEWAY_API_KEY=your_actual_key
payment.gateway.api.key=${PAYMENT_GATEWAY_API_KEY:placeholder_key_for_development}
payment.gateway.secret=${PAYMENT_GATEWAY_SECRET:placeholder_secret_for_development}

